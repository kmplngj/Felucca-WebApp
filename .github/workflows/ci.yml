# SPDX-License-Identifier: GPL-3.0-only
name: WebApp CI

on:
  pull_request:
    paths: &inputs
      - '**.js'
      - '**.mjs'
      - '**.html'
      - '**.css'
      - '**.py'
      - '**.c'
      - '**.json'
      - '**.ttf'
      - 'app/**'
      - 'test_fixtures/**'
      - 'LICENSE*'
      - 'LICENSES/**'
      - 'LICENSING.md'
      - 'FUKIAI-LICENSE.txt'
      - 'ci/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths: *inputs
  workflow_dispatch:
    inputs:
      firmware_revision:
        description: Optional full firmware SHA for a test-only contract comparison (normal runs use ci/firmware.json)
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: webapp-ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.firmware_revision || 'pinned' }}
  cancel-in-progress: true

jobs:
  contract:
    name: Host contracts and browser fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: client
          persist-credentials: false
      - name: Resolve exact firmware pin
        id: firmware
        env:
          FIRMWARE_REVISION: ${{ inputs.firmware_revision }}
        run: |
          revision=$(python3 client/ci/check.py --print-firmware-revision --firmware-revision "$FIRMWARE_REVISION")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kmplngj/Felucca
          ref: ${{ steps.firmware.outputs.revision }}
          path: firmware
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.12'
          enable-cache: false
      - name: Validate candidate client against pinned firmware
        working-directory: client
        env:
          FIRMWARE_REVISION: ${{ steps.firmware.outputs.revision }}
        run: python3 ci/check.py --firmware ../firmware --firmware-revision "$FIRMWARE_REVISION"
      - name: Retain check summary and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webapp-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: client/build/ci/
          if-no-files-found: warn
          retention-days: 7
